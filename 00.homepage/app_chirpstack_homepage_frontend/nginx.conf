worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_proxied    any;
    gzip_min_length 1000;

    server {
        listen      80;
        server_name _;
        root        /usr/share/nginx/html;

        # Site público: PODE ser indexado (diferente dos sistemas). Sem X-Robots-Tag.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Probes do Kubernetes (não gera log).
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok";
        }

        # robots.txt e sitemap.xml: cache curto (mudam sem trocar de nome).
        location ~* ^/(robots\.txt|sitemap\.xml)$ {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # Arquivos com hash no nome: cache longo.
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # index.html nunca em cache: cada deploy é visto na hora.
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }

        # SPA: qualquer rota desconhecida cai no index.html (roteamento do Angular: /v3, /v4, /infraestrutura).
        location / {
            # Sem $uri/: uma pasta em public/ com o mesmo nome de uma rota viraria 403/301.
            try_files $uri /index.html;
        }
    }
}
