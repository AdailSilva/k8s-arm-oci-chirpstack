apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Renderiza SOMENTE o Deployment (kubectl apply -k no pipeline); Namespace, Service e Ingress
# são aplicados à parte pelo job app_chirpstack_homepage_frontend do .github/workflows/main.yml.
resources:
  - 02.app-chirpstack-homepage-frontend__Deployment.yaml

images:
  - name: <OCI_REGISTRY_URL>/<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>/app-chirpstack-homepage-frontend_platform_linux-arm64
    newName: gru.ocir.io/griszz3l82u1/app-chirpstack-homepage-frontend_platform_linux-arm64
    # O pipeline troca esta tag pela versão do build só no workspace do runner (sem commit).
    # Aplicação manual (kubectl apply -k): ajuste para a versão desejada antes.
    newTag: "latest"

patches:
  - target:
      kind: Deployment
      name: app-chirpstack-homepage-frontend-deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
