
---

# Host próprio (o k8s.adailsilva.com.br é da homepage pessoal, no repositório k8s-arm-oci-always-free).
# O registro DNS "A" de chirpstack.adailsilva.com.br precisa apontar para o IP do NLB ANTES do
# primeiro deploy, senão o cert-manager não conclui o desafio HTTP-01 do Let's Encrypt.
# Sem rewrite-target / use-regex: o Angular precisa receber o path original (/v3, /v4, /infraestrutura).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-chirpstack-homepage-frontend-ingress
  namespace: chirpstack-homepage
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chirpstack.adailsilva.com.br
      secretName: app-chirpstack-homepage-frontend-tls
  rules:
    - host: chirpstack.adailsilva.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-chirpstack-homepage-frontend-service
                port:
                  number: 80
