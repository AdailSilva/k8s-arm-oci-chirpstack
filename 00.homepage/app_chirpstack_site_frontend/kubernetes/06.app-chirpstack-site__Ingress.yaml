---

# Site institucional do ChirpStack LoRaWAN (rede IoT do Adail Silva).
# Sem rewrite-target / use-regex: o Angular precisa receber o path original
# (/v3, /v4, /infraestrutura) para o roteamento da SPA funcionar.
# DNS: chirpstack.adailsilva.com.br deve apontar para o IP público do cluster antes do primeiro
# deploy, senão o desafio HTTP-01 do Let's Encrypt não fecha e o certificado
# fica pendente.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-chirpstack-site-frontend-ingress
  namespace: chirpstack-site
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/hsts: "true"
    nginx.ingress.kubernetes.io/hsts-max-age: "63072000"
    nginx.ingress.kubernetes.io/hsts-include-subdomains: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - chirpstack.adailsilva.com.br
      secretName: app-chirpstack-site-frontend-tls
  rules:
    - host: chirpstack.adailsilva.com.br
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-chirpstack-site-frontend-service
                port:
                  number: 80
