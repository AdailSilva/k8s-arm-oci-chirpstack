# =====================================================================
#  ChirpStack Manager - ambiente local completo
#    Na raiz do projeto:
#    cp .env.example .env   (preencha CHIRPSTACK_API_TOKEN e os segredos)
#    docker compose -f docker/docker-compose.yaml --env-file .env up -d --build
#    http://localhost:8080   (perfil production: API na 8083, actuator na 8084)
# =====================================================================
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: chirpstack_manager
      POSTGRES_USER: chirpstack_manager
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack_manager -d chirpstack_manager"]
      interval: 10s
      retries: 5

  chirpstack-manager-api:
    build: ../api_chirpstack_manager_backend
    environment:
      SPRING_PROFILES_ACTIVE: production
      DB_URL: jdbc:postgresql://postgres:5432/chirpstack_manager
      DB_USERNAME: chirpstack_manager
      DB_PASSWORD: ${DB_PASSWORD}
      CHIRPSTACK_BASE_URL: ${CHIRPSTACK_BASE_URL:-https://chirpstack-v4-rest-api.adailsilva.com.br}
      CHIRPSTACK_API_TOKEN: ${CHIRPSTACK_API_TOKEN:?defina CHIRPSTACK_API_TOKEN no .env}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?defina APP_JWT_SECRET no .env}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@chirpstack.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-}
      APP_CORS_ALLOWED_ORIGINS: http://localhost:8080
      APP_COOKIE_SECURE: "false"
      APP_CHAVE_CIFRAGEM: ${APP_CHAVE_CIFRAGEM:-}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Fortaleza}
      GOOGLE_DRIVE_CLIENT_ID: ${GOOGLE_DRIVE_CLIENT_ID:-}
      GOOGLE_DRIVE_CLIENT_SECRET: ${GOOGLE_DRIVE_CLIENT_SECRET:-}
      GOOGLE_DRIVE_REDIRECT_URI: http://localhost:8080/api/v1/backup/google-drive/callback
    volumes:
      - backups:/var/backups/chirpstack-manager
    depends_on:
      postgres:
        condition: service_healthy

  # O nginx.conf da imagem encaminha /api para chirpstack-manager-api:8083 (nome deste serviço).
  web:
    build: ../app_chirpstack_manager_frontend
    ports:
      - "8080:8080"
    depends_on:
      - chirpstack-manager-api

volumes:
  pgdata:
  backups:
