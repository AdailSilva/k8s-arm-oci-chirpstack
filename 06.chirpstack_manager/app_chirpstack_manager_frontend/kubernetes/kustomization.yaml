apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O ArgoCD/pipeline renderiza SOMENTE o Deployment; Service e Ingress são aplicados manualmente
# (00.UsefulScripts/01.deploy_full_app-chirpstack-manager-frontend_script.sh).
resources:
  - 02.app-chirpstack-manager-frontend__Deployment.yaml

images:
  - name: <OCI_REGISTRY_URL>/<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>/app-chirpstack-manager-frontend_platform_linux-arm64
    newName: gru.ocir.io/griszz3l82u1/app-chirpstack-manager-frontend_platform_linux-arm64
    # Atualizado pelo pipeline a cada build (tag imutável = versão calculada).
    # "latest" só até o primeiro build; o pipeline troca pela versão (0.1, 0.2...).
    newTag: "latest"

patches:
  - target:
      kind: Deployment
      name: chirpstack-manager-web
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
