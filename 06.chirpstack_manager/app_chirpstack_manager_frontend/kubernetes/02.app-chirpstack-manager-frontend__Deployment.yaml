# =====================================================================
#  Frontend (Angular + NGINX). O NGINX encaminha /api para o backend.
# =====================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chirpstack-manager-web
  namespace: chirpstack-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chirpstack-manager-web
  template:
    metadata:
      labels:
        app: chirpstack-manager-web
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          image: <OCI_REGISTRY_URL>/<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>/app-chirpstack-manager-frontend_platform_linux-arm64:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          # O NGINX (nginx.conf da imagem) encaminha /api para http://chirpstack-manager-api:8083.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
      imagePullSecrets:
        - name: oci-registry-secret
