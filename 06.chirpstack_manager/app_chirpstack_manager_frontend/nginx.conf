# =====================================================================
#  NGINX do ChirpStack Manager Web (imagem nginx-unprivileged, sem root)
#  - Serve o Angular (SPA) e encaminha /api para o backend.
#  - O backend é o Service chirpstack-manager-api:8083 (Kubernetes) ou o
#    serviço de mesmo nome do docker/docker-compose.yaml.
#  - Mesmo host para tela e API: o cookie do refresh token é same-site.
# =====================================================================
worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile      on;

    # Imagem sem root: arquivos temporários em /tmp
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp_path;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    gzip            on;
    gzip_types      text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_proxied    any;
    gzip_min_length 1000;

    # Service do backend (ClusterIP fixo no Kubernetes; nome do serviço no docker-compose)
    upstream chirpstack_manager_api {
        server chirpstack-manager-api:8083;
    }

    server {
        listen      8080;
        server_name _;
        root        /usr/share/nginx/html;
        index       index.html;

        client_max_body_size 2m;

        # Cabeçalhos de segurança
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com; font-src 'self' data: https://fonts.cdnfonts.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # API do backend
        location /api/ {
            proxy_pass http://chirpstack_manager_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 60s;
        }

        # Upload do arquivo de restauração de backup (único upload grande da API)
        location = /api/v1/backup/restaurar {
            client_max_body_size 512m;
            proxy_request_buffering off;
            proxy_pass http://chirpstack_manager_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
        }

        # Download de backups: sem buffer em disco no NGINX (arquivos grandes)
        location /api/v1/backup/arquivos/download {
            proxy_buffering off;
            proxy_pass http://chirpstack_manager_api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_read_timeout 600s;
        }

        # Arquivos com hash no nome: cache longo
        location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }

        # index.html nunca em cache: cada deploy é visto na hora
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Robots-Tag "noindex, nofollow" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.cdnfonts.com; font-src 'self' data: https://fonts.cdnfonts.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
        }

        # SPA: qualquer rota desconhecida cai no index.html (roteamento do Angular)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
