# =====================================================================
#  Segredos. NÃO versione este arquivo preenchido.
#  Crie direto no cluster, por exemplo:
#    kubectl -n chirpstack-manager create secret generic chirpstack-manager-secrets \
#      --from-literal=CHIRPSTACK_API_TOKEN='<API key ADMIN do ChirpStack>' \
#      --from-literal=APP_JWT_SECRET="$(openssl rand -base64 48)" \
#      --from-literal=APP_ADMIN_PASSWORD='<senha inicial do admin>' \
#      --from-literal=DB_PASSWORD="$(openssl rand -base64 24)" \
#      --from-literal=APP_CHAVE_CIFRAGEM="$(openssl rand -base64 32)"
#
#  Opcional (Google Drive dos backups): as credenciais do cliente OAuth podem
#  ser cadastradas na tela Backup > Google Drive OU vir daqui:
#      --from-literal=GOOGLE_DRIVE_CLIENT_ID='<client id>' \
#      --from-literal=GOOGLE_DRIVE_CLIENT_SECRET='<client secret>'
#
#  Para incluir as novas chaves num Secret que já existe:
#    kubectl -n chirpstack-manager patch secret chirpstack-manager-secrets \
#      --type merge -p "{\"stringData\":{\"APP_CHAVE_CIFRAGEM\":\"$(openssl rand -base64 32)\"}}"
# =====================================================================
apiVersion: v1
kind: Secret
metadata:
  name: chirpstack-manager-secrets
  namespace: chirpstack-manager
type: Opaque
stringData:
  CHIRPSTACK_API_TOKEN: "trocar"
  APP_JWT_SECRET: "trocar-por-um-segredo-aleatorio-com-pelo-menos-32-caracteres"
  APP_ADMIN_PASSWORD: "trocar"
  DB_PASSWORD: "trocar"
  # Chave AES-256 que cifra no banco os segredos do Google Drive. Não troque depois de conectar.
  APP_CHAVE_CIFRAGEM: "trocar-por-openssl-rand-base64-32"
  # Opcionais
  GOOGLE_DRIVE_CLIENT_ID: ""
  GOOGLE_DRIVE_CLIENT_SECRET: ""
