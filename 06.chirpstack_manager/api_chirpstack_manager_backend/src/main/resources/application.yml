# =====================================================================
#  ChirpStack Manager API
#  Todas as configurações sensíveis vêm de variáveis de ambiente.
#
#  Perfis (mesmo esquema do CSLab WEB, CardsControl e BackOffice):
#    development  porta 8081  H2 em arquivo (./data)        frontend 4201
#    staging      porta 8082  PostgreSQL local (homologação) frontend 4202
#    production   porta 8083  PostgreSQL (Kubernetes)        frontend 4203
#  Actuator/probes na porta 8084 em todos os perfis (fora do Service e do Ingress).
#
#  Rodar:  mvn spring-boot:run -Pdevelopment | -Pstaging | -Pproduction
#     ou:  SPRING_PROFILES_ACTIVE=staging java -jar target/chirpstack-manager-api.jar
# =====================================================================
spring:
  application:
    name: chirpstack-manager-api
  profiles:
    default: development
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration/{vendor}
  threads:
    virtual:
      enabled: true
  # Upload do arquivo de restauração de backup (o maior upload aceito pela API)
  servlet:
    multipart:
      max-file-size: ${APP_BACKUP_MAX_UPLOAD:512MB}
      max-request-size: ${APP_BACKUP_MAX_UPLOAD:512MB}

server:
  # Porta de cada perfil nos blocos abaixo (8081, 8082, 8083); SERVER_PORT sobrescreve.
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
  # native = Tomcat RemoteIpValve: só confia no X-Forwarded-For vindo de proxies internos (Ingress, NGINX)
  forward-headers-strategy: native

management:
  # Porta de gerenciamento SEPARADA, 8084 em todos os perfis: as probes do Kubernetes chamam
  # /actuator/health/* aqui, e o actuator fica fora do Service e do Ingress.
  server:
    port: ${MANAGEMENT_PORT:8084}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      # liveness = só a JVM (queda do banco não reinicia o pod);
      # readiness = JVM + banco (o pod sai do Service enquanto o PostgreSQL estiver fora)
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

app:
  # Fuso usado na grade do backup automático, nos nomes dos arquivos e nos indicadores de visitantes
  fuso-horario: ${APP_TIMEZONE:America/Fortaleza}

  # Conexão com a REST API do ChirpStack v4 (chirpstack-rest-api)
  chirpstack:
    base-url: ${CHIRPSTACK_BASE_URL:https://chirpstack-v4-rest-api.adailsilva.com.br}
    # API key de ADMIN gerada no ChirpStack (Network Server > API keys). Nunca vai para o navegador.
    api-token: ${CHIRPSTACK_API_TOKEN:}
    connect-timeout: 5s
    read-timeout: 30s
    # Limite máximo de itens por página aceito pelo backend
    max-page-size: 1000

  security:
    # Segredo HS256 com pelo menos 32 caracteres. OBRIGATÓRIO em produção.
    jwt-secret: ${APP_JWT_SECRET:}
    jwt-issuer: chirpstack-manager
    access-token-ttl: ${APP_ACCESS_TOKEN_TTL:15m}
    refresh-token-ttl: ${APP_REFRESH_TOKEN_TTL:7d}
    # Bloqueio de conta após falhas seguidas de login
    max-login-attempts: 5
    lockout-duration: 15m
    # Origens liberadas no CORS (separadas por vírgula)
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4201}
    # Cookie do refresh token só trafega em HTTPS (desligue apenas em desenvolvimento local)
    cookie-secure: ${APP_COOKIE_SECURE:true}
    # Administrador criado no primeiro start (somente se não existir nenhum usuário)
    bootstrap-admin-email: ${APP_ADMIN_EMAIL:admin@chirpstack.local}
    bootstrap-admin-password: ${APP_ADMIN_PASSWORD:}
    # Chave AES-256 que cifra os segredos do Google Drive no banco (openssl rand -base64 32).
    # Sem ela, a chave é derivada do APP_JWT_SECRET.
    chave-cifragem: ${APP_CHAVE_CIFRAGEM:}

  # Sessões (visitantes e controle de logoff). A política (inatividade, duração máxima, sessões
  # simultâneas) é editada na tela Sistema > Controle de sessão e fica no banco.
  sessao:
    # Sessões encerradas há mais tempo que isso saem do histórico de visitantes
    retencao-historico-dias: ${APP_SESSAO_RETENCAO_DIAS:365}

  # Backup e restauração do banco do painel
  backup:
    # Volume dos backups (subpastas manuais/, agendados/ e seguranca/)
    diretorio: ${APP_BACKUP_DIR:./data/backups}
    prefixo-arquivo: chirpstack-manager_database
    tempo-limite: ${APP_BACKUP_TEMPO_LIMITE:30m}
    historico-dias: 180

  # Envio dos backups ao Google Drive (OAuth 2.0, escopo drive.file).
  # As credenciais também podem ser cadastradas na tela (Backup > Google Drive), que tem prioridade.
  google-drive:
    client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
    client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
    # Endereço PÚBLICO do callback; cadastre-o igual no cliente OAuth do Google Cloud
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:4201/api/v1/backup/google-drive/callback}
    retorno-frontend: /sistema/backup
    pasta-padrao: ChirpStack Manager/Backups

# =====================================================================
#  development: máquina do desenvolvedor, H2 em arquivo, sem HTTPS
#  Backend http://localhost:8081  ·  frontend http://localhost:4201
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: development
  datasource:
    url: jdbc:h2:file:./data/chirpstack-manager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
server:
  port: ${SERVER_PORT:8081}
app:
  security:
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4201}
  backup:
    diretorio: ${APP_BACKUP_DIR:./data/backups}
  google-drive:
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:4201/api/v1/backup/google-drive/callback}

# =====================================================================
#  staging: homologação com PostgreSQL local (o mesmo banco da produção,
#  sem HTTPS). Crie o banco uma vez:
#    createdb -U postgres chirpstack_manager_staging
#  Backend http://localhost:8082  ·  frontend http://localhost:4202
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chirpstack_manager_staging}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      pool-name: ChirpStackManagerPool-Staging
      maximum-pool-size: 10
server:
  port: ${SERVER_PORT:8082}
app:
  security:
    cookie-secure: ${APP_COOKIE_SECURE:false}
    cors-allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4202}
  backup:
    diretorio: ${APP_BACKUP_DIR:./data-staging/backups}
  google-drive:
    redirect-uri: ${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:4202/api/v1/backup/google-drive/callback}

# =====================================================================
#  production: Kubernetes (OCI), PostgreSQL do cluster, HTTPS no Ingress.
#  APP_JWT_SECRET é obrigatório. Backend :8083 (Service), actuator :8084.
# =====================================================================
---
spring:
  config:
    activate:
      on-profile: production
  datasource:
    url: ${DB_URL:jdbc:postgresql://chirpstack-manager-postgres:5432/chirpstack_manager}
    username: ${DB_USERNAME:chirpstack_manager}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: ChirpStackManagerPool-Production
      maximum-pool-size: 10
server:
  port: ${SERVER_PORT:8083}
app:
  security:
    cookie-secure: ${APP_COOKIE_SECURE:true}
  backup:
    diretorio: ${APP_BACKUP_DIR:/var/backups/chirpstack-manager}
