# ===============================================================
# = Application settings
# ===============================================================
spring.application.name=chirpstack-manager-api
# development: maquina do desenvolvedor, H2 em arquivo, sem HTTPS
# Padrao de portas (mesmo do CSLab WEB, CardsControl e BackOffice):
#   development 8081 (frontend 4201) | staging 8082 (4202) | production 8083 (4203)
#   actuator/probes 8084 em todos os perfis (fora do Service e do Ingress)

# ===============================================================
# = Server settings
# ===============================================================
#server.address=localhost (Do not uncomment when deploying to Docker or Kubernetes)
server.address=0.0.0.0
server.port=${SERVER_PORT:8081}
server.shutdown=graceful
server.error.include-message=never
server.error.include-stacktrace=never
# native = Tomcat RemoteIpValve: so confia no X-Forwarded-For vindo de proxies internos (Ingress, NGINX)
server.forward-headers-strategy=native

# Threads virtuais (Java 21): cada requisicao ao ChirpStack nao prende uma thread de plataforma
spring.threads.virtual.enabled=true

# ===============================================================
# = Upload (restauracao de backup: o maior upload aceito pela API)
# ===============================================================
spring.servlet.multipart.max-file-size=${APP_BACKUP_MAX_UPLOAD:512MB}
spring.servlet.multipart.max-request-size=${APP_BACKUP_MAX_UPLOAD:512MB}

# ===============================================================
# = DATA SOURCE / HikariCP
# ===============================================================
# H2 em arquivo (./data), modo PostgreSQL: os dados sobrevivem ao restart.
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:file:./data/chirpstack-manager;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

spring.datasource.hikari.pool-name=ChirpStackManagerPool-Dev
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.keepalive-time=60000

# ===============================================================
# = JPA / HIBERNATE
# ===============================================================
# Estrutura criada SOMENTE pelas migrations do Flyway; o Hibernate apenas valida.
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
# OSIV (Open Session in View)
spring.jpa.open-in-view=false

# ===============================================================
# = Flyway
# ===============================================================
spring.flyway.enabled=true
spring.flyway.encoding=UTF-8
spring.flyway.locations=classpath:/db/migration/H2

# ===============================================================
# = Actuator (Kubernetes Probes)
# ===============================================================
# Porta de gerenciamento SEPARADA, 8084 em todos os perfis: as probes chamam /actuator/health/*
# aqui, e o actuator fica fora do Service e do Ingress.
management.server.port=${MANAGEMENT_PORT:8084}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
# liveness = so a JVM (queda do banco nao reinicia o pod);
# readiness = JVM + banco (o pod sai do Service enquanto o PostgreSQL estiver fora)
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db

# ===============================================================
# = Fuso horario
# ===============================================================
# Grade do backup automatico, nomes dos arquivos e indicadores de visitantes
app.fuso-horario=${APP_TIMEZONE:America/Fortaleza}

# ===============================================================
# = ChirpStack v4 - REST API (chirpstack-rest-api v4.19)
# ===============================================================
app.chirpstack.base-url=${CHIRPSTACK_BASE_URL:https://chirpstack-v4-rest-api.adailsilva.com.br}
# API key de ADMIN gerada no ChirpStack (Network Server > API keys). Nunca vai para o navegador.
app.chirpstack.api-token=${CHIRPSTACK_API_TOKEN:}
app.chirpstack.connect-timeout=5s
app.chirpstack.read-timeout=30s
# Limite maximo de itens por pagina aceito pelo backend
app.chirpstack.max-page-size=1000

# ===============================================================
# = JWT (sessao do painel)
# ===============================================================
# Segredo HS256 com pelo menos 32 caracteres. OBRIGATORIO em producao (Secret K8s).
app.security.jwt-secret=${APP_JWT_SECRET:}
app.security.jwt-issuer=chirpstack-manager
app.security.access-token-ttl=${APP_ACCESS_TOKEN_TTL:15m}
app.security.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:7d}

# ===============================================================
# = Login - protecao contra forca bruta
# ===============================================================
app.security.max-login-attempts=5
app.security.lockout-duration=15m

# ===============================================================
# = CORS e cookie do refresh token
# ===============================================================
# Origens liberadas no CORS (separadas por virgula)
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:4201}
# Cookie do refresh token so trafega em HTTPS (false apenas sem HTTPS: development e staging)
app.security.cookie-secure=${APP_COOKIE_SECURE:false}

# ===============================================================
# = Administrador inicial (usado SOMENTE com a tabela de usuarios vazia)
# ===============================================================
# Sem senha definida, uma senha aleatoria e gerada e mostrada UMA vez no log.
app.security.bootstrap-admin-email=${APP_ADMIN_EMAIL:admin@chirpstack.local}
app.security.bootstrap-admin-password=${APP_ADMIN_PASSWORD:}

# ===============================================================
# = Cifragem de segredos (credenciais do Google Drive no banco)
# ===============================================================
# Chave AES-256 (openssl rand -base64 32). Sem ela, a chave e derivada do APP_JWT_SECRET.
app.security.chave-cifragem=${APP_CHAVE_CIFRAGEM:}

# ===============================================================
# = Sessoes (visitantes e controle de logoff)
# ===============================================================
# A politica (inatividade, duracao maxima, sessoes simultaneas) e editada na tela
# Sistema > Controle de sessao e fica no banco. Aqui, so a retencao do historico.
app.sessao.retencao-historico-dias=${APP_SESSAO_RETENCAO_DIAS:365}

# ===============================================================
# = Backup e restauracao do banco do painel
# ===============================================================
# Volume dos backups (subpastas manuais/, agendados/ e seguranca/)
app.backup.diretorio=${APP_BACKUP_DIR:./data/backups}
app.backup.prefixo-arquivo=chirpstack-manager_database
app.backup.tempo-limite=${APP_BACKUP_TEMPO_LIMITE:30m}
app.backup.historico-dias=180

# ===============================================================
# = Backup no Google Drive (OAuth 2.0, escopo drive.file)
# ===============================================================
# As credenciais tambem podem ser cadastradas na tela (Backup > Google Drive), que tem prioridade.
app.google-drive.client-id=${GOOGLE_DRIVE_CLIENT_ID:}
app.google-drive.client-secret=${GOOGLE_DRIVE_CLIENT_SECRET:}
# Endereco PUBLICO do callback; cadastre-o igual no cliente OAuth do Google Cloud
app.google-drive.redirect-uri=${GOOGLE_DRIVE_REDIRECT_URI:http://localhost:4201/api/v1/backup/google-drive/callback}
app.google-drive.retorno-frontend=/sistema/backup
app.google-drive.pasta-padrao=ChirpStack Manager/Backups

# ===============================================================
# = Loggers
# ===============================================================
logging.level.br.com.adailsilva.chirpstackmanager=DEBUG
logging.level.org.hibernate=INFO
logging.level.com.zaxxer.hikari=INFO
