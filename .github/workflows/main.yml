          if [ -f "/home/ubuntu/bin/oci" ]; then
            echo "OCI CLI já instalado: $(/home/ubuntu/bin/oci --version)"
          else
            echo "OCI CLI não encontrado, instalando..."
            # Remove diretório residual que bloqueia o instalador
            rm -rf /home/ubuntu/lib/oracle-cli
            curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
            chmod +x install.sh
            ./install.sh --accept-all-defaults
          fi

