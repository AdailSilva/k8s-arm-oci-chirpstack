          set -euo pipefail
          TENANCY=$(sed -n 's/^tenancy[[:space:]]*=[[:space:]]*//p' ~/.oci/config | head -1)

          EXISTE=$(oci artifacts container repository list --compartment-id "$TENANCY" \
