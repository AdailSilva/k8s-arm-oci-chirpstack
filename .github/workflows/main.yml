          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --push \
            --provenance=false --sbom=false \
            --platform linux/arm64 \
            --cache-from type=registry,ref=${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-consumer-frontend_platform_linux-arm64:buildcache \
            --cache-to   type=registry,ref=${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-consumer-frontend_platform_linux-arm64:buildcache,mode=max \
            -f 05.chirpstack_consumer/app_chirpstack_consumer_frontend/Dockerfile \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-consumer-frontend_platform_linux-arm64:${{ steps.version.outputs.VERSION }} \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-consumer-frontend_platform_linux-arm64:latest \
            05.chirpstack_consumer/app_chirpstack_consumer_frontend

      # ─── MANIFESTOS ─────────────────────────────────────────────────────────
