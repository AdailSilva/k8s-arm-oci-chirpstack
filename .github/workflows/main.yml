# Conteúdo para pipeline do GitHub Actions na raíz do projeto.
## .github/workflows/main.yml
#
# Repositório: AdailSilva/k8s-arm-oci-chirpstack — padrão dos 5 repositórios (base: CSLab).
#   app_chirpstack_site_frontend       → 00.homepage/app_chirpstack_site_frontend/**
#   api_chirpstack_consumer_backend    → 05.chirpstack_consumer/api_chirpstack_consumer_backend/**
#   app_chirpstack_consumer_frontend   → 05.chirpstack_consumer/app_chirpstack_consumer_frontend/**
#   api_chirpstack_manager_backend     → 06.chirpstack_manager/api_chirpstack_manager_backend/**
#   app_chirpstack_manager_frontend    → 06.chirpstack_manager/app_chirpstack_manager_frontend/**
# ChirpStack v3/v4 (03/04) são infraestrutura aplicada pelos scripts de 00.UsefulScripts.
#

name: CI/CD with GitHub Actions

on:
  push:
    branches:
      - master
    paths:
      - '00.homepage/app_chirpstack_site_frontend/**'
      - '05.chirpstack_consumer/api_chirpstack_consumer_backend/**'
      - '05.chirpstack_consumer/app_chirpstack_consumer_frontend/**'
      - '06.chirpstack_manager/api_chirpstack_manager_backend/**'
      - '06.chirpstack_manager/app_chirpstack_manager_frontend/**'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Tipo de versão: minor (padrão) ou major'
        required: false
        default: 'minor'
      target:
        description: 'O que deployar: app-chirpstack-site-frontend, api-chirpstack-consumer-backend, app-chirpstack-consumer-frontend, api-chirpstack-manager-backend, app-chirpstack-manager-frontend ou ambos'
        required: false
        default: 'ambos'

# ─────────────────────────────────────────────────────────────────────────────
# JOB: DETECT – descobre quais paths mudaram e expõe outputs para os jobs
# seguintes. Em workflow_dispatch usa o input `target` para simular a decisão.
# ─────────────────────────────────────────────────────────────────────────────
# ─────────────────────────────────────────────────────────────────────────────
# CONCORRENCIA
# Todos os jobs de deploy empurram commit para o MESMO repositorio (o passo "Fixar versão
# no GitOps"). Duas execucoes simultaneas do workflow disputam o push e uma
# perde a corrida. Serializar aqui evita a disputa na origem; o retry de cada
# passo continua existindo como rede de seguranca.
# cancel-in-progress: false e essencial -- a execucao anterior precisa TERMINAR,
# nao morrer no meio de um push, o que deixaria o GitOps sem o newTag novo.
# ─────────────────────────────────────────────────────────────────────────────
concurrency:
  group: gitops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    name: Detectar alterações
    #runs-on: ubuntu-latest
    # ─── RUNNER ARM64 EXPLICITO (13/10/2026) ───────────────────────────────
    # Com o runner do notebook (x64, label "flutter") registrado neste repo,
    # `runs-on: self-hosted` sozinho deixaria o GitHub mandar QUALQUER job para
    # o notebook -- que nao tem kubectl/kubeconfig, OCI CLI em /home/ubuntu nem
    # build nativo ARM64. Todos os jobs deste arquivo exigem ARM64 (worker-0).
    # Os builds mobile ficam em .github/workflows/mobile.yml.
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 10
    outputs:
      app_chirpstack_site_frontend:     ${{ steps.filter.outputs.app_chirpstack_site_frontend }}
      api_chirpstack_consumer_backend:  ${{ steps.filter.outputs.api_chirpstack_consumer_backend }}
      app_chirpstack_consumer_frontend: ${{ steps.filter.outputs.app_chirpstack_consumer_frontend }}
      api_chirpstack_manager_backend:   ${{ steps.filter.outputs.api_chirpstack_manager_backend }}
      app_chirpstack_manager_frontend:  ${{ steps.filter.outputs.app_chirpstack_manager_frontend }}
    steps:
      # ─── LIMPEZA DE DISCO DO RUNNER (07/10/2026) ───────────────────────────
      # O runner self-hosted mora no worker-0, que TAMBEM e no do Kubernetes. O
      # Docker do runner (/var/lib/docker) divide o boot volume de 50GB com o
      # containerd do kubelet, mas o garbage collector do kubelet so enxerga o
      # containerd: imagens, cache de build e builders buildx orfaos (execucoes
      # canceladas nao passam pelo post-step de cleanup) acumulam ate o kubelet
      # marcar o no com node.kubernetes.io/disk-pressure e despejar os pods --
      # que entao nao cabem nos outros workers ("Insufficient cpu").
      # Roda antes de qualquer build; nunca derruba o workflow (continue-on-error).
      # So remove o que tem mais de 24h/72h, para nao tocar em build de outro repo
      # (chirpstack etc.) que esteja rodando no mesmo host.
      - name: Limpeza de disco do runner
        continue-on-error: true
        run: |
          set +e
          echo "== Disco ANTES"; df -h / ; docker system df

          # 1) Builders buildx orfaos (containers buildx_buildkit_*) com mais de 24h
          LIMITE=$(date -d '24 hours ago' +%s)
          for ID in $(docker ps -aq --filter "name=buildx_buildkit_"); do
            CRIADO=$(date -d "$(docker inspect -f '{{.Created}}' "$ID")" +%s 2>/dev/null || echo 0)
            if [ "$CRIADO" -gt 0 ] && [ "$CRIADO" -lt "$LIMITE" ]; then
              echo "Removendo builder orfao: $(docker inspect -f '{{.Name}}' "$ID")"
              docker rm -f "$ID"
            fi
          done
          # Volumes de estado desses builders que ficaram sem dono
          docker volume ls -q --filter dangling=true | grep '^buildx_buildkit_' | xargs -r docker volume rm

          # 2) Docker do runner: containers parados, imagens e cache com mais de 72h
          docker container prune -f --filter "until=24h"
          docker image prune -af --filter "until=72h"
          docker builder prune -af --filter "until=72h"

          # 3) containerd do kubelet: imagens sem nenhum container usando
          #    (tags :latest antigas que o imagePullPolicy: Always deixa para tras)
          sudo -n crictl rmi --prune 2>/dev/null || echo "crictl indisponivel sem senha -- pulando"

          # 4) Logs do systemd
          sudo -n journalctl --vacuum-size=500M 2>/dev/null || true

          echo "== Disco DEPOIS"; df -h / ; docker system df

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}


      - name: Filtrar paths alterados
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            app_chirpstack_site_frontend:
              - '00.homepage/app_chirpstack_site_frontend/**'
            api_chirpstack_consumer_backend:
              - '05.chirpstack_consumer/api_chirpstack_consumer_backend/**'
            app_chirpstack_consumer_frontend:
              - '05.chirpstack_consumer/app_chirpstack_consumer_frontend/**'
            api_chirpstack_manager_backend:
              - '06.chirpstack_manager/api_chirpstack_manager_backend/**'
            app_chirpstack_manager_frontend:
              - '06.chirpstack_manager/app_chirpstack_manager_frontend/**'

      # Em workflow_dispatch sobrescreve os outputs conforme o input `target`
      - name: Sobrescrever outputs (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" == "app-chirpstack-site-frontend" ] || [ "$TARGET" == "ambos" ]; then
            echo "app_chirpstack_site_frontend=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "api-chirpstack-consumer-backend" ] || [ "$TARGET" == "ambos" ]; then
            echo "api_chirpstack_consumer_backend=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "app-chirpstack-consumer-frontend" ] || [ "$TARGET" == "ambos" ]; then
            echo "app_chirpstack_consumer_frontend=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "api-chirpstack-manager-backend" ] || [ "$TARGET" == "ambos" ]; then
            echo "api_chirpstack_manager_backend=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "app-chirpstack-manager-frontend" ] || [ "$TARGET" == "ambos" ]; then
            echo "app_chirpstack_manager_frontend=true" >> $GITHUB_OUTPUT
          fi


# ─────────────────────────────────────────────────────────────────────────────
# JOB: CHIRPSTACK - SITE – FRONTEND (Angular / Avalon 21 + Nginx) – chirpstack.adailsilva.com.br
# Site institucional do ChirpStack LoRaWAN (rede IoT).
# Disparado quando o job detect sinaliza app_chirpstack_site_frontend=true
# Padrao CSLab: build -> OCIR -> infra base -> newTag no GitOps (ArgoCD sincroniza o Deployment).
# ─────────────────────────────────────────────────────────────────────────────
  app_chirpstack_site_frontend:
    name: ChirpStack - Site – Frontend (Angular)
    #runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    needs: detect
    if: needs.detect.outputs.app_chirpstack_site_frontend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ─── VERSIONAMENTO ──────────────────────────────────────────────────────
      - name: Calcular próxima versão (app-chirpstack-site-frontend)
        id: version
        run: |
          PREFIX="app-chirpstack-site-frontend"
          LATEST=$(git tag --list "${PREFIX}-[0-9]*.[0-9]*" | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            LATEST="${PREFIX}-0.0"
          fi

          NUMS=${LATEST#${PREFIX}-}
          MAJOR=$(echo "$NUMS" | cut -d. -f1)
          MINOR=$(echo "$NUMS" | cut -d. -f2)

          if [ "${{ github.event.inputs.version_type }}" == "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$((MINOR + 1))"
          fi

          FULL_TAG="${PREFIX}-${NEW_VERSION}"
          echo "Nova versão: $FULL_TAG"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "FULL_TAG=$FULL_TAG"  >> $GITHUB_OUTPUT

      - name: Criar tag Git (app-chirpstack-site-frontend)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.FULL_TAG }}
          git push origin ${{ steps.version.outputs.FULL_TAG }}
      # ────────────────────────────────────────────────────────────────────────

        # - name: Set up QEMU
        # uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Install OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}"   > ~/.oci/config
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/key.pem

          # Corrige o path do key_file para o home real do runner
          sed -i "s|key_file=.*|key_file=$HOME/.oci/key.pem|g" ~/.oci/config

          if [ -f "/home/ubuntu/bin/oci" ]; then
            echo "OCI CLI já instalado: $(/home/ubuntu/bin/oci --version)"
          else
            echo "OCI CLI não encontrado, instalando..."
            # Remove diretório residual que bloqueia o instalador
            rm -rf /home/ubuntu/lib/oracle-cli
            curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
            chmod +x install.sh
            ./install.sh --accept-all-defaults
          fi

          # echo "/home/runner/bin" >> $GITHUB_PATH
          echo "/home/ubuntu/bin" >> $GITHUB_PATH
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/config
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/key.pem

      - name: Install kubectl
        run: |
          mkdir -p /tmp/.kube

          if ! command -v kubectl &> /dev/null; then
            echo "kubectl não encontrado, instalando..."
            curl -L "https://dl.k8s.io/release/v1.31.4/bin/linux/arm64/kubectl" -o /tmp/kubectl
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          else
            echo "kubectl já instalado: $(kubectl version --client 2>/dev/null | head -1)"
          fi

          echo "${{ secrets.KUBECONFIG }}" > /tmp/.kube/config
          echo "KUBECONFIG=/tmp/.kube/config" >> $GITHUB_ENV

      # ─── NAMESPACE (22/10/2026) ─────────────────────────────────────────────
      # Garante o namespace ANTES de qualquer comando que dependa dele. Se nao
      # existir (ex.: excluido manualmente), aplica o 01.create__Namespace.yaml;
      # se estiver em Terminating, espera a exclusao terminar e recria. Os
      # applies do 01 mais abaixo continuam (sao idempotentes).
      - name: Garantir namespace (cria se não existir)
        env:
          NS_YAML: 00.homepage/app_chirpstack_site_frontend/kubernetes/01.create__Namespace.yaml
        run: |
          set -euo pipefail
          NS=$(kubectl create --dry-run=client -f "$NS_YAML" -o jsonpath='{.metadata.name}')
          fase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || true; }
          F=$(fase); echo ">> Namespace '$NS': ${F:-inexistente}"

          # Terminating (exclusao anterior ainda em andamento): espera ate 300s.
          for _ in $(seq 1 60); do
            [ "$(fase)" = "Terminating" ] || break
            echo ">> '$NS' em Terminating -- aguardando a exclusao terminar..."
            sleep 5
          done
          if [ "$(fase)" = "Terminating" ]; then
            echo ">> ERRO: '$NS' preso em Terminating ha mais de 300s. Condicoes:"
            kubectl get namespace "$NS" -o jsonpath='{range .status.conditions[*]}  {.type}: {.message}{"\n"}{end}' || true
            echo ">> Para liberar: kubectl get namespace $NS -o json | jq '.spec.finalizers = []' | kubectl replace --raw \"/api/v1/namespaces/$NS/finalize\" -f -"
            exit 1
          fi

          # Inexistente -> cria; Active -> reaplica (idempotente).
          [ -z "$(fase)" ] && echo ">> Criando namespace '$NS' a partir de $NS_YAML"
          kubectl apply --server-side -f "$NS_YAML"

          # So segue com o namespace Active e a ServiceAccount default criada.
          for _ in $(seq 1 30); do
            if [ "$(fase)" = "Active" ] && kubectl get serviceaccount default -n "$NS" &>/dev/null; then
              echo ">> Namespace '$NS' pronto."
              exit 0
            fi
            sleep 2
          done
          echo ">> ERRO: namespace '$NS' nao ficou pronto em 60s."
          exit 1

      - name: Pods em execução (antes do deploy)
        run: kubectl get pods -n chirpstack-site || echo "Namespace ainda não existe"

      # ─── REPOSITORIO OCIR (12/11/2026) ──────────────────────────────────────
      # O Terraform (oci_artifacts_container_repository) e a fonte oficial; este passo so
      # cobre o primeiro deploy antes do "terraform apply": se o repositorio nao existir,
      # cria no MESMO compartment do udp-health-check-server-1700 (presente nos 5
      # repositorios), privado. Depois rode oci_artifacts_container_repository/
      # import_existing_repositories.sh para trazer o repositorio para o state.
      - name: Garantir repositório OCIR (app-chirpstack-site-frontend)
        env:
          REPO: app-chirpstack-site-frontend_platform_linux-arm64
          REF:  udp-health-check-server-1700_platform_linux-arm64
        run: |
          set -euo pipefail
          TENANCY=$(sed -n 's/^tenancy[[:space:]]*=[[:space:]]*//p' ~/.oci/config | head -1)

          EXISTE=$(oci artifacts container repository list --compartment-id "$TENANCY" \
            --compartment-id-in-subtree true --display-name "$REPO" --all \
            --query 'length(data.items)' --raw-output 2>/dev/null || echo 0)
          if [ "${EXISTE:-0}" != "0" ]; then
            echo ">> Repositorio OCIR '$REPO' ja existe."
            exit 0
          fi

          COMP=$(oci artifacts container repository list --compartment-id "$TENANCY" \
            --compartment-id-in-subtree true --display-name "$REF" --all \
            --query 'data.items[0]."compartment-id"' --raw-output)
          if [ -z "$COMP" ] || [ "$COMP" = "null" ]; then
            echo ">> ERRO: nao achei o repositorio de referencia '$REF' para descobrir o compartment."
            exit 1
          fi

          echo ">> Criando repositorio OCIR '$REPO' (privado) no compartment do '$REF'..."
          oci artifacts container repository create --compartment-id "$COMP" \
            --display-name "$REPO" --is-public false --is-immutable false >/dev/null
          echo ">> Criado. Lembrete: rode oci_artifacts_container_repository/import_existing_repositories.sh."

      - name: Login no Docker Registry (OCI)
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      # Dockerfile multi-stage, sem build-args. Repositorio OCIR app-chirpstack-site-frontend_platform_linux-arm64
      # (Terraform; o passo "Garantir repositório OCIR" cria se ainda nao existir).
      - name: Build & Push – ChirpStack - Site – Frontend
        run: |
          # Plataformas disponíveis: linux/amd64, linux/arm64
          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --push \
            --provenance=false --sbom=false \
            --platform linux/arm64 \
            --cache-from type=registry,ref=${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-site-frontend_platform_linux-arm64:buildcache \
            --cache-to   type=registry,ref=${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-site-frontend_platform_linux-arm64:buildcache,mode=max \
            -f 00.homepage/app_chirpstack_site_frontend/Dockerfile \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-site-frontend_platform_linux-arm64:${{ steps.version.outputs.VERSION }} \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-site-frontend_platform_linux-arm64:latest \
            00.homepage/app_chirpstack_site_frontend

      # ─── MANIFESTOS ─────────────────────────────────────────────────────────
      #   02  Deployment     (NAO entra aqui: quem aplica e o ArgoCD)
      #   01.create__Namespace.yaml
      #   03.app-chirpstack-site-frontend__Service.yaml
      #   06.app-chirpstack-site__Ingress.yaml
      # ────────────────────────────────────────────────────────────────────────
      - name: Aplicar infraestrutura base ChirpStack - Site – Frontend (Namespace, Service, Ingress)
        run: |
          set -euo pipefail

          K8S=00.homepage/app_chirpstack_site_frontend/kubernetes

          kubectl apply --server-side -f "$K8S/01.create__Namespace.yaml"

          kubectl apply --server-side -f "$K8S/03.app-chirpstack-site-frontend__Service.yaml"

          kubectl apply --server-side -f "$K8S/06.app-chirpstack-site__Ingress.yaml"
      - name: Criar/atualizar imagePullSecret do OCI Registry (chirpstack-site)
        run: |
          kubectl create secret docker-registry oci-registry-secret \
            --docker-server=${{ secrets.OCI_REGISTRY_URL }} \
            --docker-username='${{ secrets.OCI_REGISTRY_USERNAME }}' \
            --docker-password='${{ secrets.OCI_REGISTRY_PASSWORD }}' \
            --docker-email='${{ secrets.OCI_REGISTRY_EMAIL }}' \
            --namespace=chirpstack-site \
            --dry-run=client -o yaml | kubectl apply -f -

      # O newTag e alterado num WORKTREE separado, criado a partir de origin/master.
      # Assim o working tree do build fica intocado e cada tentativa parte sempre do
      # estado remoto mais novo -- nao ha rebase, portanto nao ha conflito possivel.
      - name: Fixar versão no GitOps (ArgoCD sincroniza)
        env:
          KUST: 00.homepage/app_chirpstack_site_frontend/kubernetes/kustomization.yaml
          COMP: app-chirpstack-site-frontend
          VER:  ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          git config user.email "github-actions@github.com"
          git config user.name  "github-actions[bot]"

          WT="$(mktemp -d)"
          trap 'git worktree remove --force "$WT" 2>/dev/null || true; git worktree prune || true' EXIT

          for i in $(seq 1 5); do
            git fetch origin master

            git worktree remove --force "$WT" 2>/dev/null || true
            git worktree prune
            git worktree add --detach "$WT" FETCH_HEAD

            # Modulo CONGELADO (linha "# chirpstack-release-congelado: <motivo>" na kustomization):
            # a imagem desta versao ja foi publicada no OCIR e a tag Git criada, mas o newTag
            # NAO e trocado. Remova a linha para voltar ao deploy automatico a cada build.
            if grep -q '^# chirpstack-release-congelado:' "$WT/$KUST"; then
              echo ">> ${COMP} esta CONGELADO -- versao ${VER} publicada, mas NAO implantada."
              grep '^# chirpstack-release-congelado:' "$WT/$KUST" | sed 's/^# chirpstack-release-congelado:/>>   congelado por:/'
              exit 0
            fi

            sed -i -E "s|^([[:space:]]*newTag:).*|\1 \"${VER}\"|" "$WT/$KUST"
            git -C "$WT" add "$KUST"

            # Pergunta feita ao index: so "nada a commitar" sai com sucesso.
            if git -C "$WT" diff --cached --quiet; then
              echo ">> newTag de ${COMP} ja esta em ${VER} -- nada a commitar."
              exit 0
            fi

            git -C "$WT" commit -m "deploy: ${COMP} ${VER} [skip ci]"

            # HEAD:master nao depende do nome do branch local.
            if git -C "$WT" push origin HEAD:master; then
              echo ">> GitOps atualizado: ${COMP} -> ${VER} (tentativa ${i})."
              exit 0
            fi

            # Espera ALEATORIA: com sleep fixo, duas execucoes concorrentes voltam a
            # colidir no mesmo instante, tentativa apos tentativa.
            ESPERA=$(( RANDOM % 5 + 2 ))
            echo ">> push perdeu a corrida (tentativa ${i}); refazendo sobre o remoto em ${ESPERA}s..."
            sleep "${ESPERA}"
          done

          echo ">> falha ao dar push no GitOps apos 5 tentativas"
          exit 1

      # ────────────────────────────────────────────────────────────────────────


# ─────────────────────────────────────────────────────────────────────────────
# JOB: CHIRPSTACK - CONSUMER – BACKEND (Spring Boot) – interno (proxy /api e /ws do frontend)
# API do ChirpStack Consumer (sem banco de dados).
# Disparado quando o job detect sinaliza api_chirpstack_consumer_backend=true
# Padrao CSLab: build -> OCIR -> infra base -> newTag no GitOps (ArgoCD sincroniza o Deployment).
# ─────────────────────────────────────────────────────────────────────────────
  api_chirpstack_consumer_backend:
    name: ChirpStack - Consumer – Backend (Spring Boot)
    #runs-on: ubuntu-latest
    runs-on: [self-hosted, Linux, ARM64]
    timeout-minutes: 45
    needs: detect
    if: needs.detect.outputs.api_chirpstack_consumer_backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ─── VERSIONAMENTO ──────────────────────────────────────────────────────
      - name: Calcular próxima versão (api-chirpstack-consumer-backend)
        id: version
        run: |
          PREFIX="api-chirpstack-consumer-backend"
          LATEST=$(git tag --list "${PREFIX}-[0-9]*.[0-9]*" | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            LATEST="${PREFIX}-0.0"
          fi

          NUMS=${LATEST#${PREFIX}-}
          MAJOR=$(echo "$NUMS" | cut -d. -f1)
          MINOR=$(echo "$NUMS" | cut -d. -f2)

          if [ "${{ github.event.inputs.version_type }}" == "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$((MINOR + 1))"
          fi

          FULL_TAG="${PREFIX}-${NEW_VERSION}"
          echo "Nova versão: $FULL_TAG"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "FULL_TAG=$FULL_TAG"  >> $GITHUB_OUTPUT

      - name: Criar tag Git (api-chirpstack-consumer-backend)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.FULL_TAG }}
          git push origin ${{ steps.version.outputs.FULL_TAG }}
      # ────────────────────────────────────────────────────────────────────────

        # - name: Set up QEMU
        # uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Install OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}"   > ~/.oci/config
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/key.pem

          # Corrige o path do key_file para o home real do runner
          sed -i "s|key_file=.*|key_file=$HOME/.oci/key.pem|g" ~/.oci/config

          if [ -f "/home/ubuntu/bin/oci" ]; then
            echo "OCI CLI já instalado: $(/home/ubuntu/bin/oci --version)"
          else
            echo "OCI CLI não encontrado, instalando..."
            # Remove diretório residual que bloqueia o instalador
            rm -rf /home/ubuntu/lib/oracle-cli
            curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
            chmod +x install.sh
            ./install.sh --accept-all-defaults
          fi

          # echo "/home/runner/bin" >> $GITHUB_PATH
          echo "/home/ubuntu/bin" >> $GITHUB_PATH
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/config
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/key.pem

      - name: Install kubectl
        run: |
          mkdir -p /tmp/.kube

          if ! command -v kubectl &> /dev/null; then
            echo "kubectl não encontrado, instalando..."
            curl -L "https://dl.k8s.io/release/v1.31.4/bin/linux/arm64/kubectl" -o /tmp/kubectl
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          else
            echo "kubectl já instalado: $(kubectl version --client 2>/dev/null | head -1)"
          fi

          echo "${{ secrets.KUBECONFIG }}" > /tmp/.kube/config
          echo "KUBECONFIG=/tmp/.kube/config" >> $GITHUB_ENV

      # ─── NAMESPACE (22/10/2026) ─────────────────────────────────────────────
      # Garante o namespace ANTES de qualquer comando que dependa dele. Se nao
      # existir (ex.: excluido manualmente), aplica o 01.create__Namespace.yaml;
      # se estiver em Terminating, espera a exclusao terminar e recria. Os
      # applies do 01 mais abaixo continuam (sao idempotentes).
      - name: Garantir namespace (cria se não existir)
        env:
          NS_YAML: 05.chirpstack_consumer/api_chirpstack_consumer_backend/kubernetes/01.create__Namespace.yaml
        run: |
          set -euo pipefail
          NS=$(kubectl create --dry-run=client -f "$NS_YAML" -o jsonpath='{.metadata.name}')
          fase() { kubectl get namespace "$NS" -o jsonpath='{.status.phase}' 2>/dev/null || true; }
          F=$(fase); echo ">> Namespace '$NS': ${F:-inexistente}"

          # Terminating (exclusao anterior ainda em andamento): espera ate 300s.
          for _ in $(seq 1 60); do
            [ "$(fase)" = "Terminating" ] || break
            echo ">> '$NS' em Terminating -- aguardando a exclusao terminar..."
            sleep 5
          done
          if [ "$(fase)" = "Terminating" ]; then
            echo ">> ERRO: '$NS' preso em Terminating ha mais de 300s. Condicoes:"
            kubectl get namespace "$NS" -o jsonpath='{range .status.conditions[*]}  {.type}: {.message}{"\n"}{end}' || true
            echo ">> Para liberar: kubectl get namespace $NS -o json | jq '.spec.finalizers = []' | kubectl replace --raw \"/api/v1/namespaces/$NS/finalize\" -f -"
            exit 1
          fi

          # Inexistente -> cria; Active -> reaplica (idempotente).
          [ -z "$(fase)" ] && echo ">> Criando namespace '$NS' a partir de $NS_YAML"
          kubectl apply --server-side -f "$NS_YAML"

          # So segue com o namespace Active e a ServiceAccount default criada.
          for _ in $(seq 1 30); do
            if [ "$(fase)" = "Active" ] && kubectl get serviceaccount default -n "$NS" &>/dev/null; then
              echo ">> Namespace '$NS' pronto."
              exit 0
            fi
            sleep 2
          done
          echo ">> ERRO: namespace '$NS' nao ficou pronto em 60s."
          exit 1

      - name: Pods em execução (antes do deploy)
        run: kubectl get pods -n chirpstack-consumer || echo "Namespace ainda não existe"

      # ─── REPOSITORIO OCIR (12/11/2026) ──────────────────────────────────────
      # O Terraform (oci_artifacts_container_repository) e a fonte oficial; este passo so
      # cobre o primeiro deploy antes do "terraform apply": se o repositorio nao existir,
      # cria no MESMO compartment do udp-health-check-server-1700 (presente nos 5
      # repositorios), privado. Depois rode oci_artifacts_container_repository/
