          COMP: api-chirpstack-manager-backend
          VER:  ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail

          git config user.email "github-actions@github.com"
          git config user.name  "github-actions[bot]"

          WT="$(mktemp -d)"
