      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      # Dockerfile multi-stage, sem build-args. Repositorio OCIR app-chirpstack-consumer-frontend_platform_linux-arm64
      # (Terraform; o passo "Garantir repositório OCIR" cria se ainda nao existir).
      - name: Build & Push – ChirpStack - Consumer – Frontend
        run: |
