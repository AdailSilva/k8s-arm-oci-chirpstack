server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Compressão gzip para assets estáticos
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Cache longo para assets com hash no nome (Angular outputHashing=all)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Proxy reverso para o backend Spring Boot
    # Ajuste o nome do Service K8S e a porta conforme seu ambiente
    location /api/ {
        proxy_pass         http://api-chirpstack-consumer-backend-svc:8080/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # WebSocket (Spring WebSocket / STOMP)
    location /ws/ {
        proxy_pass         http://api-chirpstack-consumer-backend-svc:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
    }

    # Suporte a deep-link (Angular Router) – redireciona qualquer rota para index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
