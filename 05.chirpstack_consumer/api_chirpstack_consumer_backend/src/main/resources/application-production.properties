# ===============================
# = Application settings
# ===============================
spring.application.name=chirpstack-consumer
spring.application.version=1.0.0

# ===============================
# = Server settings
# ===============================
server.servlet.context-path=/chirpstack-consumer/
#server.address=localhost (Do not uncomment when deploying to Docker or Kubernetes)
server.address=0.0.0.0
server.port=8083

# ===============================
# = Default connection pool
# ===============================
spring.datasource.hikari.connectionTimeout=20000
spring.datasource.hikari.maximumPoolSize=5

spring.datasource.hikari.initialization-fail-timeout=1

spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.connection-test-query=SELECT 1

# ===============================
# = DATA SOURCE
# ===============================

# Set here configurations for the database connection
spring.datasource.url=${POSTGRESQL_HOST}
spring.datasource.username=${POSTGRESQL_USERNAME}
spring.datasource.password=${POSTGRESQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the connection alive if idle for a long time (needed in production)
#spring.datasource.testWhileIdle=true
#spring.datasource.validationQuery=SELECT 1

#spring.sql.init.schema-locations=classpath:/sql/schema.sql
#spring.sql.init.data-locations=classpath:/sql/data.sql
#spring.sql.init.mode=always

# ===============================
# = JPA / HIBERNATE
# ===============================
# Show or not log for each sql query
spring.jpa.show-sql=false

# Hibernate ddl auto (create, create-drop, update): with "create-drop" the database
# schema will be automatically created afresh for every start of application
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none

# OSIV (Open Session in View)
spring.jpa.open-in-view=false

# Platform
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
#spring.jpa.database-platform=org.hibernate.dialect.PostgreSQL95Dialect

# Datasource Initialization
spring.jpa.defer-datasource-initialization=false

# Naming strategy
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl
#spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
#spring.jpa.hibernate.naming.physical-strategy=org.springframework.boot.orm.jpa.hibernate.SpringPhysicalNamingStrategy

# Allows Hibernate to generate SQL optimized for a particular DBMS
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# = Flyway
# ===============================
spring.flyway.enabled=false
spring.flyway.encoding=UTF-8
spring.flyway.create-schemas=true
spring.flyway.default-schema=chirpstack-consumer_schema
spring.flyway.driver-class-name=org.postgresql.Driver
spring.flyway.user=postgres
spring.flyway.password=chirpstack-consumer
spring.flyway.schemas=chirpstack-consumer_schema
#spring.flyway.tablespace=chirpstack-consumer
spring.flyway.locations=classpath:/db/migration/PostgreSQL
spring.flyway.baselineOnMigrate=true

# Jackson
#spring.jackson.property-naming-strategy=SNAKE_CASE
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE
spring.jackson.deserialization.fail-on-unknown-properties=true

# Circular-references
spring.main.allow-circular-references=true

# ===============================
# = API Security
# ===============================
api.security.auth.basic=false

#api.security.token.secret=chirpstack-consumer
# If you don't find the secret (CHIRPSTACK_CONSUMER_JWT_SECRET), use the pattern "chirpstack-consumer-secret-key":
api.security.jwt.secret=${CHIRPSTACK_CONSUMER_JWT_SECRET:2f979ce86381682d0a2b2044068c1e2b}

# Expiration Time In Minutes:
api.security.jwt.expirationMs=100000000

# Expiration Time In Hours:
api.security.jwt.refreshExpirationMs=24000000

# ===============================
# = Loggers
# ===============================
logging.level.org.springframework.security.web.csrf.CsrfFilter=DEBUG

# ===============================================================
# = E-mail configurations - App passwords -> ufhy xfpg uwkm rjuz
# ===============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${CSC_APP_USERNAME_GOOGLE:codeinserver@gmail.com}
spring.mail.password=${CSC_APP_PASSWORD_GOOGLE:ufhyxfpguwkmrjuz}
spring.mail.properties.mail.transport.protocol=smtp
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.from=codeinserver@gmail.com
email.to=adail101@hotmail.com

# ===============================================================
# = Actuator configurations
# ===============================================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
