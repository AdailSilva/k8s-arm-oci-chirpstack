# Conteúdo para pipeline do GitHub Actions na raíz do projeto.
## .github/workflows/main.yml

name: CI/CD with GitHub Actions

on:
  push:
    branches:
      - master
    paths:
      - '00.homepage/02.real_time/api_k8s_dashboard_backend/**'
      - '00.homepage/02.real_time/app_k8s_dashboard_frontend/**'
      - '05.chirpstack_consumer/api_chirpstack_consumer_backend/**'
      - '05.chirpstack_consumer/app_chirpstack_consumer_frontend/**'
  workflow_dispatch:
    inputs:
      version_type:
        description: 'Tipo de versão: minor (padrão) ou major'
        required: false
        default: 'minor'
      target:
        description: 'O que deployar: api_k8s_dashboard_backend, app_k8s_dashboard_frontend, api_chirpstack_consumer_backend, app_chirpstack_consumer_frontend ou ambos'
        required: false
        default: 'ambos'

# ─────────────────────────────────────────────────────────────────────────────
# JOB: DETECT – descobre quais paths mudaram e expõe outputs para os jobs
# seguintes. Em workflow_dispatch usa o input `target` para simular a decisão.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  detect:
    name: Detectar alterações
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    timeout-minutes: 10
    outputs:
      api_k8s_dashboard_backend:        ${{ steps.filter.outputs.api_k8s_dashboard_backend }}
      app_k8s_dashboard_frontend:       ${{ steps.filter.outputs.app_k8s_dashboard_frontend }}
      api_chirpstack_consumer_backend:  ${{ steps.filter.outputs.api_chirpstack_consumer_backend }}
      app_chirpstack_consumer_frontend: ${{ steps.filter.outputs.app_chirpstack_consumer_frontend }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      - name: Filtrar paths alterados
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api_k8s_dashboard_backend:
              - '00.homepage/02.real_time/api_k8s_dashboard_backend/**'
            app_k8s_dashboard_frontend:
              - '00.homepage/02.real_time/app_k8s_dashboard_frontend/**'
            api_chirpstack_consumer_backend:
              - '05.chirpstack_consumer/api_chirpstack_consumer_backend/**'
            app_chirpstack_consumer_frontend:
              - '05.chirpstack_consumer/app_chirpstack_consumer_frontend/**'

      # Em workflow_dispatch sobrescreve os outputs conforme o input `target`
      - name: Sobrescrever outputs (workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        run: |
          TARGET="${{ github.event.inputs.target }}"
          if [ "$TARGET" == "api_k8s_dashboard_backend" ]        || [ "$TARGET" == "ambos" ]; then
            echo "api_k8s_dashboard_backend=true"  >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "app_k8s_dashboard_frontend" ]       || [ "$TARGET" == "ambos" ]; then
            echo "app_k8s_dashboard_frontend=true" >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "api_chirpstack_consumer_backend" ]  || [ "$TARGET" == "ambos" ]; then
            echo "api_chirpstack_consumer_backend=true"  >> $GITHUB_OUTPUT
          fi
          if [ "$TARGET" == "app_chirpstack_consumer_frontend" ] || [ "$TARGET" == "ambos" ]; then
            echo "app_chirpstack_consumer_frontend=true" >> $GITHUB_OUTPUT
          fi

# ─────────────────────────────────────────────────────────────────────────────
# JOB: HOMEPAGE – BACKEND (Spring Boot)
# Disparado quando o job detect sinaliza api_k8s_dashboard_backend=true
# ─────────────────────────────────────────────────────────────────────────────
  api_k8s_dashboard_backend:
    name: HomePage – Backend (Spring Boot)
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    timeout-minutes: 30
    needs: detect
    if: needs.detect.outputs.api_k8s_dashboard_backend == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ─── VERSIONAMENTO ──────────────────────────────────────────────────────
      - name: Calcular próxima versão (api-k8s-dashboard-backend)
        id: version
        run: |
          PREFIX="api-k8s-dashboard-backend"
          LATEST=$(git tag --list "${PREFIX}-[0-9]*.[0-9]*" | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            LATEST="${PREFIX}-0.0"
          fi

          # Extrai só a parte numérica
          NUMS=${LATEST#${PREFIX}-}
          MAJOR=$(echo "$NUMS" | cut -d. -f1)
          MINOR=$(echo "$NUMS" | cut -d. -f2)

          if [ "${{ github.event.inputs.version_type }}" == "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$((MINOR + 1))"
          fi

          FULL_TAG="${PREFIX}-${NEW_VERSION}"
          echo "Nova versão: $FULL_TAG"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "FULL_TAG=$FULL_TAG"  >> $GITHUB_OUTPUT

      - name: Criar tag Git (api-k8s-dashboard-backend)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.FULL_TAG }}
          git push origin ${{ steps.version.outputs.FULL_TAG }}
      # ────────────────────────────────────────────────────────────────────────

        # - name: Set up QEMU
        # uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Install OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}"   > ~/.oci/config
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/key.pem

          # Corrige o path do key_file para o home real do runner
          sed -i "s|key_file=.*|key_file=$HOME/.oci/key.pem|g" ~/.oci/config

          if [ -f "/home/ubuntu/bin/oci" ]; then
            echo "OCI CLI já instalado: $(/home/ubuntu/bin/oci --version)"
          else
            echo "OCI CLI não encontrado, instalando..."
            # Remove diretório residual que bloqueia o instalador
            rm -rf /home/ubuntu/lib/oracle-cli
            curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
            chmod +x install.sh
            ./install.sh --accept-all-defaults
          fi

          # echo "/home/runner/bin" >> $GITHUB_PATH
          echo "/home/ubuntu/bin" >> $GITHUB_PATH
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/config
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/key.pem

      - name: Install kubectl
        run: |
          mkdir -p /tmp/.kube

          if ! command -v kubectl &> /dev/null; then
            echo "kubectl não encontrado, instalando..."
            curl -L "https://dl.k8s.io/release/v1.22.4/bin/linux/amd64/kubectl" -o /tmp/kubectl
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          else
            echo "kubectl já instalado: $(kubectl version --client --short 2>/dev/null)"
          fi

          echo "${{ secrets.KUBECONFIG }}" > /tmp/.kube/config
          echo "KUBECONFIG=/tmp/.kube/config" >> $GITHUB_ENV

      - name: Pods em execução (antes do deploy)
        run: kubectl get pods -n k8s-dashboard || echo "Namespace ainda não existe"

      - name: Login no Docker Registry (OCI)
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Build & Push – K8S Dashboard Backend
        run: |
          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --push \
            #--platform linux/amd64,linux/arm64 \
            --platform linux/arm64 \
            -f 00.homepage/02.real_time/api_k8s_dashboard_backend/Dockerfile \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/api-k8s-dashboard-backend_platform_linux-arm64:${{ steps.version.outputs.VERSION }} \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/api-k8s-dashboard-backend_platform_linux-arm64:latest \
            00.homepage/02.real_time/api_k8s_dashboard_backend

      - name: Aplicar infraestrutura base (Namespace, RBAC, Services, Ingress)
        run: |
          # Aplica em ordem — Namespace DEVE ser o primeiro
          kubectl apply --server-side -f 00.homepage/02.real_time/kubernetes/01.create__Namespace.yaml
          kubectl apply --server-side -f 00.homepage/02.real_time/kubernetes/02.homepage-nginx__RBAC.yaml
          kubectl apply --server-side -f 00.homepage/02.real_time/kubernetes/04.homepage-nginx__Backend_Service.yaml
          kubectl apply --server-side -f 00.homepage/02.real_time/kubernetes/09.homepage-nginx__Ingress.yaml

      - name: Criar/atualizar imagePullSecret do OCI Registry
        run: |
          kubectl create secret docker-registry oci-registry-secret \
            --docker-server=${{ secrets.OCI_REGISTRY_URL }} \
            --docker-username='${{ secrets.OCI_REGISTRY_USERNAME }}' \
            --docker-password='${{ secrets.OCI_REGISTRY_PASSWORD }}' \
            --docker-email='${{ secrets.OCI_REGISTRY_EMAIL }}' \
            --namespace=k8s-dashboard \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Backend no K8S
        run: |
          sed -i \
            -e 's|<OCI_REGISTRY_URL>|${{ secrets.OCI_REGISTRY_URL }}|g' \
            -e 's|<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>|${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}|g' \
            00.homepage/02.real_time/kubernetes/03.homepage-nginx__Backend_Deployment.yaml
          # Confirmar substituição (não deve aparecer a placeholder)
          grep "image:" 00.homepage/02.real_time/kubernetes/03.homepage-nginx__Backend_Deployment.yaml
          kubectl apply -f 00.homepage/02.real_time/kubernetes/03.homepage-nginx__Backend_Deployment.yaml -n k8s-dashboard

      - name: Restart Backend Deployment
        run: kubectl rollout restart deployment api-k8s-dashboard-backend -n k8s-dashboard

      - name: Aguardar rollout do Backend
        run: kubectl rollout status deployment/api-k8s-dashboard-backend -n k8s-dashboard --timeout=120s

      # ─── LIMPEZA DE IMAGENS SEM TAG (api-k8s-dashboard-backend) ───────────────────────────────
      - name: Limpar imagens unknown do OCI Registry (api-k8s-dashboard-backend)
        run: |
          IMAGE_IDS=$(oci artifacts container image list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_ID }} \
            --repository-name api-k8s-dashboard-backend_platform_linux-arm64 \
            --lifecycle-state AVAILABLE \
            --all \
            --query 'data.items[*].{"id":id,"name":"display-name"}' \
            --raw-output | \
            jq -r '.[] | select(.name | test("unknown")) | .id')

          if [ -z "$IMAGE_IDS" ]; then
            echo "Nenhuma imagem unknown encontrada."
          else
            echo "Deletando imagens unknown..."
            for IMAGE_ID in $IMAGE_IDS; do
              echo "  → Deletando: $IMAGE_ID"
              oci artifacts container image delete \
                --image-id "$IMAGE_ID" \
                --force
            done
            echo "Limpeza concluída."
          fi
      # ────────────────────────────────────────────────────────────────────────


# ─────────────────────────────────────────────────────────────────────────────
# JOB: HOMEPAGE – FRONTEND (Angular)
# Disparado quando o job detect sinaliza app_k8s_dashboard_frontend=true
# ─────────────────────────────────────────────────────────────────────────────
