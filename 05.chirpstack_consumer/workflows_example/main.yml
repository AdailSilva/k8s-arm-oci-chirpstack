        run: |
          mkdir -p /tmp/.kube

          if ! command -v kubectl &> /dev/null; then
            echo "kubectl não encontrado, instalando..."
            curl -L "https://dl.k8s.io/release/v1.22.4/bin/linux/amd64/kubectl" -o /tmp/kubectl
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          else
            echo "kubectl já instalado: $(kubectl version --client --short 2>/dev/null)"
          fi

          echo "${{ secrets.KUBECONFIG }}" > /tmp/.kube/config
          echo "KUBECONFIG=/tmp/.kube/config" >> $GITHUB_ENV

      - name: Pods em execução (antes do deploy)
        run: kubectl get pods -n chirpstack-consumer || echo "Namespace ainda não existe"

      - name: Login no Docker Registry (OCI)
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Build & Push – ChirpStack Consumer Backend
        run: |
          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --push \
            #--platform linux/amd64,linux/arm64 \
            --platform linux/arm64 \
            -f 05.chirpstack_consumer/api_chirpstack_consumer_backend/Dockerfile \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/api-chirpstack-consumer-backend_platform_linux-arm64:${{ steps.version.outputs.VERSION }} \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/api-chirpstack-consumer-backend_platform_linux-arm64:latest \
            05.chirpstack_consumer/api_chirpstack_consumer_backend

      - name: Aplicar infraestrutura base ChirpStack Consumer (Namespace, Services, Ingress)
        run: |
          # Aplica em ordem — Namespace DEVE ser o primeiro
          kubectl apply --server-side -f 05.chirpstack_consumer/kubernetes/01.create__Namespace.yaml
          kubectl apply --server-side -f 05.chirpstack_consumer/kubernetes/03.chirpstack-consumer__Backend_Service.yaml
          kubectl apply --server-side -f 05.chirpstack_consumer/kubernetes/06.chirpstack-consumer__Ingress.yaml

      - name: Criar/atualizar imagePullSecret do OCI Registry (chirpstack-consumer)
        run: |
          kubectl create secret docker-registry oci-registry-secret \
            --docker-server=${{ secrets.OCI_REGISTRY_URL }} \
            --docker-username='${{ secrets.OCI_REGISTRY_USERNAME }}' \
            --docker-password='${{ secrets.OCI_REGISTRY_PASSWORD }}' \
            --docker-email='${{ secrets.OCI_REGISTRY_EMAIL }}' \
            --namespace=chirpstack-consumer \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ChirpStack Consumer Backend no K8S
        run: |
          sed -i \
            -e 's|<OCI_REGISTRY_URL>|${{ secrets.OCI_REGISTRY_URL }}|g' \
            -e 's|<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>|${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}|g' \
            05.chirpstack_consumer/kubernetes/02.chirpstack-consumer__Backend_Deployment.yaml
          # Confirmar substituição (não deve aparecer a placeholder)
          grep "image:" 05.chirpstack_consumer/kubernetes/02.chirpstack-consumer__Backend_Deployment.yaml
          kubectl apply -f 05.chirpstack_consumer/kubernetes/02.chirpstack-consumer__Backend_Deployment.yaml -n chirpstack-consumer

      - name: Restart ChirpStack Consumer Backend Deployment
        run: kubectl rollout restart deployment api-chirpstack-consumer-backend -n chirpstack-consumer

      - name: Aguardar rollout do ChirpStack Consumer Backend
        run: kubectl rollout status deployment/api-chirpstack-consumer-backend -n chirpstack-consumer --timeout=120s

      # ─── LIMPEZA DE IMAGENS SEM TAG (api-chirpstack-consumer-backend) ───────────
      - name: Limpar imagens unknown do OCI Registry (api-chirpstack-consumer-backend)
        run: |
          IMAGE_IDS=$(oci artifacts container image list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_ID }} \
            --repository-name api-chirpstack-consumer-backend_platform_linux-arm64 \
            --lifecycle-state AVAILABLE \
            --all \
            --query 'data.items[*].{"id":id,"name":"display-name"}' \
            --raw-output | \
            jq -r '.[] | select(.name | test("unknown")) | .id')

          if [ -z "$IMAGE_IDS" ]; then
            echo "Nenhuma imagem unknown encontrada."
          else
            echo "Deletando imagens unknown..."
            for IMAGE_ID in $IMAGE_IDS; do
              echo "  → Deletando: $IMAGE_ID"
              oci artifacts container image delete \
                --image-id "$IMAGE_ID" \
                --force
            done
            echo "Limpeza concluída."
          fi
      # ────────────────────────────────────────────────────────────────────────


# ─────────────────────────────────────────────────────────────────────────────
# JOB: CHIRPSTACK-CONSUMER-FRONTEND (Angular)
# Disparado quando o job detect sinaliza app_chirpstack_consumer_frontend=true
# Aguarda api_chirpstack_consumer_backend terminar (ou ser skipped) antes de rodar
# ─────────────────────────────────────────────────────────────────────────────
  app_chirpstack_consumer_frontend:
    name: ChirpStack Consumer – Frontend (Angular)
    #runs-on: ubuntu-latest
    runs-on: self-hosted
    timeout-minutes: 45
    needs: [detect, api_chirpstack_consumer_backend]
    if: |
      always() &&
      needs.detect.outputs.app_chirpstack_consumer_frontend == 'true' &&
      (needs.api_chirpstack_consumer_backend.result == 'success' || needs.api_chirpstack_consumer_backend.result == 'skipped')

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT }}

      # ─── VERSIONAMENTO ──────────────────────────────────────────────────────
      - name: Calcular próxima versão (app-chirpstack-consumer-frontend)
        id: version
        run: |
          PREFIX="app-chirpstack-consumer-frontend"
          LATEST=$(git tag --list "${PREFIX}-[0-9]*.[0-9]*" | sort -V | tail -1)

          if [ -z "$LATEST" ]; then
            LATEST="${PREFIX}-0.0"
          fi

          NUMS=${LATEST#${PREFIX}-}
          MAJOR=$(echo "$NUMS" | cut -d. -f1)
          MINOR=$(echo "$NUMS" | cut -d. -f2)

          if [ "${{ github.event.inputs.version_type }}" == "major" ]; then
            NEW_VERSION="$((MAJOR + 1)).0"
          else
            NEW_VERSION="$MAJOR.$((MINOR + 1))"
          fi

          FULL_TAG="${PREFIX}-${NEW_VERSION}"
          echo "Nova versão: $FULL_TAG"
          echo "VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "FULL_TAG=$FULL_TAG"  >> $GITHUB_OUTPUT

      - name: Criar tag Git (app-chirpstack-consumer-frontend)
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag ${{ steps.version.outputs.FULL_TAG }}
          git push origin ${{ steps.version.outputs.FULL_TAG }}
      # ────────────────────────────────────────────────────────────────────────

        # - name: Set up QEMU
        # uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container

      - name: Install OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CONFIG }}"   > ~/.oci/config
          echo "${{ secrets.OCI_KEY_FILE }}" > ~/.oci/key.pem

          # Corrige o path do key_file para o home real do runner
          sed -i "s|key_file=.*|key_file=$HOME/.oci/key.pem|g" ~/.oci/config

          if [ -f "/home/ubuntu/bin/oci" ]; then
            echo "OCI CLI já instalado: $(/home/ubuntu/bin/oci --version)"
          else
            echo "OCI CLI não encontrado, instalando..."
            # Remove diretório residual que bloqueia o instalador
            rm -rf /home/ubuntu/lib/oracle-cli
            curl -L -O https://raw.githubusercontent.com/oracle/oci-cli/master/scripts/install/install.sh
            chmod +x install.sh
            ./install.sh --accept-all-defaults
          fi

          # echo "/home/runner/bin" >> $GITHUB_PATH
          echo "/home/ubuntu/bin" >> $GITHUB_PATH
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/config
          /home/ubuntu/bin/oci setup repair-file-permissions --file ~/.oci/key.pem

      - name: Install kubectl
        run: |
          mkdir -p /tmp/.kube

          if ! command -v kubectl &> /dev/null; then
            echo "kubectl não encontrado, instalando..."
            curl -L "https://dl.k8s.io/release/v1.22.4/bin/linux/amd64/kubectl" -o /tmp/kubectl
            chmod +x /tmp/kubectl
            sudo mv /tmp/kubectl /usr/local/bin/kubectl
          else
            echo "kubectl já instalado: $(kubectl version --client --short 2>/dev/null)"
          fi

          echo "${{ secrets.KUBECONFIG }}" > /tmp/.kube/config
          echo "KUBECONFIG=/tmp/.kube/config" >> $GITHUB_ENV

      - name: Pods em execução (antes do deploy)
        run: kubectl get pods -n chirpstack-consumer || echo "Namespace ainda não existe"

      - name: Login no Docker Registry (OCI)
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.OCI_REGISTRY_URL }}
          username: ${{ secrets.OCI_REGISTRY_USERNAME }}
          password: ${{ secrets.OCI_REGISTRY_PASSWORD }}

      - name: Available platforms
        run: echo ${{ steps.buildx.outputs.platforms }}

      - name: Build & Push – ChirpStack Consumer Frontend
        run: |
          docker buildx build \
            --builder ${{ steps.buildx.outputs.name }} \
            --push \
            #--platform linux/amd64,linux/arm64 \
            --platform linux/arm64 \
            -f 05.chirpstack_consumer/app_chirpstack_consumer_frontend/Dockerfile \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-consumer-frontend_platform_linux-arm64:${{ steps.version.outputs.VERSION }} \
            -t ${{ secrets.OCI_REGISTRY_URL }}/${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}/app-chirpstack-consumer-frontend_platform_linux-arm64:latest \
            05.chirpstack_consumer/app_chirpstack_consumer_frontend

      - name: Aplicar infraestrutura base ChirpStack Consumer (Namespace, Services, Ingress)
        run: |
          # Garante Namespace mesmo quando api-chirpstack-consumer-backend foi skipped
          kubectl apply --server-side -f 05.chirpstack_consumer/kubernetes/01.create__Namespace.yaml
          kubectl apply --server-side -f 05.chirpstack_consumer/kubernetes/05.chirpstack-consumer__Frontend_Service.yaml
          kubectl apply --server-side -f 05.chirpstack_consumer/kubernetes/06.chirpstack-consumer__Ingress.yaml

      - name: Criar/atualizar imagePullSecret do OCI Registry (chirpstack-consumer)
        run: |
          kubectl create secret docker-registry oci-registry-secret \
            --docker-server=${{ secrets.OCI_REGISTRY_URL }} \
            --docker-username='${{ secrets.OCI_REGISTRY_USERNAME }}' \
            --docker-password='${{ secrets.OCI_REGISTRY_PASSWORD }}' \
            --docker-email='${{ secrets.OCI_REGISTRY_EMAIL }}' \
            --namespace=chirpstack-consumer \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy ChirpStack Consumer Frontend no K8S
        run: |
          sed -i \
            -e 's|<OCI_REGISTRY_URL>|${{ secrets.OCI_REGISTRY_URL }}|g' \
            -e 's|<OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE>|${{ secrets.OCI_REGISTRY_OBJECT_STORAGE_NAMESPACE }}|g' \
            05.chirpstack_consumer/kubernetes/04.chirpstack-consumer__Frontend_Deployment.yaml
          # Confirmar substituição (não deve aparecer a placeholder)
          grep "image:" 05.chirpstack_consumer/kubernetes/04.chirpstack-consumer__Frontend_Deployment.yaml
          kubectl apply -f 05.chirpstack_consumer/kubernetes/04.chirpstack-consumer__Frontend_Deployment.yaml -n chirpstack-consumer

      - name: Restart ChirpStack Consumer Frontend Deployment
        run: kubectl rollout restart deployment app-chirpstack-consumer-frontend -n chirpstack-consumer

      - name: Aguardar rollout do ChirpStack Consumer Frontend
        run: kubectl rollout status deployment/app-chirpstack-consumer-frontend -n chirpstack-consumer --timeout=120s

      # ─── LIMPEZA DE IMAGENS SEM TAG (app-chirpstack-consumer-frontend) ──────────
      - name: Limpar imagens unknown do OCI Registry (app-chirpstack-consumer-frontend)
        run: |
          IMAGE_IDS=$(oci artifacts container image list \
            --compartment-id ${{ secrets.OCI_COMPARTMENT_ID }} \
            --repository-name app-chirpstack-consumer-frontend_platform_linux-arm64 \
            --lifecycle-state AVAILABLE \
            --all \
            --query 'data.items[*].{"id":id,"name":"display-name"}' \
            --raw-output | \
            jq -r '.[] | select(.name | test("unknown")) | .id')

          if [ -z "$IMAGE_IDS" ]; then
            echo "Nenhuma imagem unknown encontrada."
          else
            echo "Deletando imagens unknown..."
            for IMAGE_ID in $IMAGE_IDS; do
              echo "  → Deletando: $IMAGE_ID"
              oci artifacts container image delete \
                --image-id "$IMAGE_ID" \
                --force
            done
            echo "Limpeza concluída."
          fi
      # ────────────────────────────────────────────────────────────────────────
